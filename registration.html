<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration | Smart Library</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f8fc;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #12345a;
        }

        .hero {
            background: linear-gradient(120deg, #12345a, #2876a8);
            color: white;
            padding: 40px 20px;
        }

        .registration-card {
            border: none;
            border-radius: 15px;
        }

        footer {
            background: #12345a;
            color: white;
        }
    </style>
</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            📚 Smart Library
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="registration.html">
                        Registration
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hero Section -->
<section class="hero text-center">
    <div class="container">
        <h1 class="fw-bold">Library Registration</h1>
        <p class="lead mb-0">Join our library and start exploring knowledge.</p>
    </div>
</section>

<!-- Registration Form -->
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card registration-card shadow-sm p-4">
                <h3 class="text-center fw-bold mb-4">
                    Member Registration
                </h3>

                <form id="registrationForm">

                    <div class="mb-3">
                        <label for="name" class="form-label">
                            Full Name
                        </label>
                        <input type="text" class="form-control"
                               id="name" name="name"
                               placeholder="Enter your full name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email Address
                        </label>
                        <input type="email" class="form-control"
                               id="email" name="email"
                               placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">
                            Phone Number
                        </label>
                        <input type="tel" class="form-control"
                               id="phone" name="phone"
                               placeholder="Enter your phone number" required>
                    </div>

                    <div class="mb-3">
                        <label for="gender" class="form-label">
                            Gender
                        </label>
                        <select class="form-select" id="gender"
                                name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                            <option value="prefer-not-to-say">
                                Prefer not to say
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">
                            Address
                        </label>
                        <textarea class="form-control" id="address"
                                  name="address" rows="3"
                                  placeholder="Enter your address"
                                  required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="date" class="form-label">
                            Date of Birth
                        </label>
                        <input type="date" class="form-control"
                               id="date" name="date" required>
                    </div>

                    <button type="submit"
                            class="btn btn-warning w-100 fw-bold">
                        Register Now
                    </button>

                    <p id="message" class="text-success text-center mt-3 mb-0"
                       role="status" aria-live="polite"></p>

                </form>
            </div>

        </div>
    </div>
</section>

<!-- Footer -->
<footer class="text-center py-3">
    <p class="mb-0">
        &copy; 2026 Smart Library Management System
    </p>
</footer>

<script>
    document.getElementById("registrationForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("message").textContent =
                "Registration form submitted successfully!";

            this.reset();
        });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
